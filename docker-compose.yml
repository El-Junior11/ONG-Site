
services:
  postgres:
    image: postgres:16-alpine
    container_name: site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: site_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - site-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: site-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - site-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: site-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"
    networks:
      - site-network

volumes:
  postgres_data:

networks:
  site-network:
    driver: bridge
